name: IDP Banking CI/CD

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main

env:
  WEBAPP_NAME: webapp-banking-idp
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "18"

jobs:

  test-backend:
    name: Backend Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt
          pip install pytest pytest-asyncio

      - name: Run tests
        run: |
          cd backend
          pytest tests/ -v --tb=short
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-4.1-mini
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ secrets.AZURE_OPENAI_DEPLOYMENT }}

  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        run: |
          cd frontend
          npm ci
          npm run build
        env:
          VITE_API_URL: https://webapp-banking-idp.azurewebsites.net


      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

  deploy-backend:
    name: Deploy Backend
    runs-on: ubuntu-latest
    needs:
      - test-backend
      - build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          cd backend
          pip install -r requirements.txt

      - name: Zip backend
        run: |
          cd backend
          zip -r ../backend-deploy.zip . \
            -x "uploads/*" \
            -x "documents.json" \
            -x "__pycache__/*" \
            -x "*.pyc" \
            -x "tests/*" \
            -x ".env"

      - name: Login to Azure
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.WEBAPP_NAME }}
          package: backend-deploy.zip

      - name: Health check
        env:
          APP_NAME: ${{ env.WEBAPP_NAME }}
        run: |
          sleep 30
          URL="[${app_name}.azurewebsites.net](https://${APP_NAME}.azurewebsites.net/health)"
          echo "Checking: $URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$URL")
          echo "Status: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Health check failed"
            exit 1
          fi
          echo "Backend deployment OK"

  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs:
      - build-frontend
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist

  smoke-test:
    name: Smoke Test
    runs-on: ubuntu-latest
    needs:
      - deploy-backend
      - deploy-frontend
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Health check
        env:
          APP_NAME: ${{ env.WEBAPP_NAME }}
        run: |
          URL="[${app_name}.azurewebsites.net](https://${APP_NAME}.azurewebsites.net/health)"
          echo "Testing: $URL"
          curl -f "$URL"
          echo "Health check passed"

      - name: Document upload test
        env:
          APP_NAME: ${{ env.WEBAPP_NAME }}
        run: |
          URL="[${app_name}.azurewebsites.net](https://${APP_NAME}.azurewebsites.net)"
          echo "INVOICE INV-SMOKE-001 Total INR 50000 Vendor Test Corp Mumbai" > smoke.txt
          RESP=$(curl -s -X POST "${URL}/documents/upload" -F "file=@smoke.txt")
          echo "Response: $RESP"
          echo "$RESP" | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert 'id' in d, 'Missing id'
          assert 'fields' in d, 'Missing fields'
          print('Smoke test PASSED')
          "
